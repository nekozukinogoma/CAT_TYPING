<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catタイピング</title>
  <!-- ポップでかわいいフォントの読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Yomogi&family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet" />
  
  <style>
    :root {
      --brown: #4b3223;
      --paper: #fffdf7;
      --pink: #df9295;
      --pink-dark: #d77d81;
      --pink-light: #e89b9e;
      --line: #d8c5ad;
      --cream: #f8f1e4;
      --done-color: #dd8f91;
      --pending-color: #cdbdad;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: 
        radial-gradient(circle at 20% 20%, #ffffff 0 2px, transparent 3px) 0 0/28px 28px,
        #f5ecdc;
      color: var(--brown);
      font-family: "Zen Maru Gothic", sans-serif;
    }

    .game-shell {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: clamp(14px, 3vw, 42px);
      position: relative;
    }

    .screen {
      display: none;
      width: min(1100px, 100%);
      min-height: min(720px, 92vh);
      background: rgba(255, 253, 247, 0.93);
      border: 2px solid var(--line);
      border-radius: 28px;
      box-shadow: 0 10px 24px rgba(123, 98, 64, 0.17);
      position: relative;
      overflow: hidden;
      text-align: center;
      padding: clamp(25px, 5vw, 64px);
    }

    .screen.active {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .paw {
      position: fixed;
      opacity: 0.17;
      color: #db9996;
      font-size: 4rem;
      z-index: -1;
      pointer-events: none;
    }
    .paw-one { top: 8%; left: 6%; transform: rotate(-20deg); }
    .paw-two { bottom: 10%; right: 8%; transform: rotate(25deg); }
    .paw-three { top: 12%; right: 14%; transform: rotate(15deg); }

    .top-score-container {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .top-score {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--brown);
      background: var(--cream);
      padding: 6px 20px;
      border-radius: 20px;
      border: 1px solid var(--line);
    }

    .eyebrow {
      color: var(--pink-dark);
      font-weight: 700;
      margin-top: 8px;
      font-size: 1.15rem;
    }

    .title-screen h1 {
      font-family: "Yomogi", cursive;
      font-size: clamp(3.5rem, 8vw, 6rem);
      color: var(--pink-dark);
      margin: 4px 0;
      text-shadow: 2px 2px 0 #fff;
    }

    .subtitle {
      font-size: 1.25rem;
      color: #7a604c;
      margin-bottom: 10px;
    }

    .space-button {
      background: var(--pink);
      color: #fff;
      border: none;
      padding: 18px 46px;
      font-size: 1.45rem;
      font-weight: 900;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(223, 146, 149, 0.4);
      transition: transform 0.15s, background-color 0.2s;
      font-family: "Zen Maru Gothic", sans-serif;
      margin: 10px 0;
    }

    .space-button:hover {
      background: var(--pink-dark);
      transform: scale(1.03);
    }

    .cat-photo {
      width: 250px;
      height: 150px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      box-shadow: none;
      border-radius: 0;
      overflow: visible;
    }

    .cat-photo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .game-header {
      width: 100%;
      display: flex;
      justify-content: space-around;
      align-items: center;
      background: var(--cream);
      padding: 12px 20px;
      border-radius: 20px;
      border: 1px solid var(--line);
      font-size: 1.05rem;
      font-weight: 700;
    }

    .game-header strong {
      font-size: 1.45rem;
      color: var(--pink-dark);
      margin-left: 4px;
    }

    .cat-track-area {
      width: 100%;
      background: #fdfaf3;
      border: 2px dashed var(--line);
      border-radius: 20px;
      height: 115px;
      position: relative;
      margin: 12px 0;
      overflow: hidden;
    }

    .track-line-bg {
      position: absolute;
      top: 50%;
      left: 30px;
      right: 30px;
      height: 3px;
      background: var(--line);
      transform: translateY(-50%);
    }

    /* コマ送り猫アバター（枠線・背景・丸枠なし） */
    .cat-avatar {
      position: absolute;
      top: calc(50% - 42px);
      right: 30px;
      width: 100px;
      height: 85px;
      border: none;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
      overflow: visible;
      z-index: 5;
    }

    .cat-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .cat-avatar.koma-step-1 {
      transform: rotate(-14deg) translateY(-8px) scale(1.08);
    }
    .cat-avatar.koma-step-2 {
      transform: rotate(14deg) translateY(-1px) scale(0.95);
    }

    .word-card {
      width: 100%;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      border: 2px solid var(--line);
      border-radius: 24px;
      padding: 20px;
      margin: 8px 0;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.02);
    }

    .instruction {
      font-size: 0.95rem;
      color: #8c735d;
      margin-bottom: 8px;
    }

    .word-display {
      font-family: "Yomogi", "Zen Maru Gothic", cursive;
      font-size: clamp(2.8rem, 7vw, 5.5rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.35;
      color: var(--brown);
      text-align: center;
      margin: 0.5rem auto;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .romaji-display {
      margin: 0.2rem 0;
      color: #b0756d;
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      font-weight: 700;
      letter-spacing: 0.12em;
      text-align: center;
    }

    .reading-display {
      min-height: 1.5em;
      color: #9a7c69;
      font-size: 0.95rem;
      letter-spacing: 0.1em;
    }

    .done { color: var(--done-color); }
    .current { color: var(--brown); border-bottom: 4px solid var(--pink-light); }
    .pending { color: var(--pending-color); }
    .unit-group { display: inline-block; margin: 0 0.15em; }

    .game-footer {
      width: 100%;
      border-top: 1px dashed var(--line);
      padding-top: 14px;
      display: flex;
      justify-content: space-around;
      align-items: center;
      font-size: 0.9rem;
      position: relative;
    }

    .game-footer strong {
      font-size: 1.3rem;
      color: #c87d7f;
      margin-left: 4px;
    }

    .stats-group {
      display: flex;
      gap: clamp(16px, 4vw, 40px);
    }

    .cat-speech-wrapper {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .speech-bubble {
      position: relative;
      background: #ffffff;
      border: 3px solid var(--pink-dark);
      border-radius: 22px;
      padding: 12px 24px;
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--brown);
      box-shadow: 0 4px 14px rgba(223, 146, 149, 0.25);
      min-width: 300px;
      text-align: center;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      right: -12px;
      top: 50%;
      transform: translateY(-50%);
      border-style: solid;
      border-width: 8px 0 8px 12px;
      border-color: transparent transparent transparent #ffffff;
      z-index: 2;
    }

    .speech-bubble::before {
      content: '';
      position: absolute;
      right: -16px;
      top: 50%;
      transform: translateY(-50%);
      border-style: solid;
      border-width: 10px 0 10px 15px;
      border-color: transparent transparent transparent var(--pink-dark);
      z-index: 1;
    }

    .game-footer .game-cat {
      width: 130px;
      height: 80px;
    }

    .result-screen h2 {
      font-family: "Yomogi", cursive;
      color: var(--pink-dark);
      font-size: clamp(3.3rem, 7vw, 6rem);
      margin: 0.25rem 0;
    }

    .result-score {
      font-size: 1.2rem;
      margin-bottom: 12px;
    }

    .result-score strong {
      font-size: clamp(3rem, 8vw, 5.5rem);
      color: var(--pink-dark);
      display: block;
      line-height: 1;
    }

    .result-stats {
      margin: 15px 0;
      display: flex;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 14px 4px;
      width: min(700px, 100%);
      background: #fff;
    }

    .result-stats div {
      flex: 1;
      font-size: 0.85rem;
      border-right: 1px solid #e5d6c6;
    }

    .result-stats div:last-child { border: 0; }
    .result-stats strong { display: block; font-size: 1.4rem; color: #ad6d70; margin-top: 4px; }
    .new-best { color: #e67e22; font-weight: bold; font-size: 1.2rem; margin-bottom: 8px; min-height: 1.5em; }
  </style>
</head>
<body>

  <div class="paw paw-one">🐾</div>
  <div class="paw paw-two">🐾</div>
  <div class="paw paw-three">🐾</div>

  <main class="game-shell">

    <!-- 1. タイトル画面 -->
    <section id="title-screen" class="screen active">
      <div class="top-score-container">
        <div class="top-score">👑 ハイスコア <strong id="best-score-title">0</strong></div>
        <div class="top-score">🐾 累計保護数 <strong id="total-rescued-title">0匹</strong></div>
      </div>
      <p class="eyebrow">🐾 ねこと ことばの おさんぽ 🐾</p>
      <h1>Catタイピング</h1>
      <p class="subtitle">画面に出る文字を、そのまま打とう！</p>

      <button id="start-button" class="space-button" type="button" onclick="startGame()">🐾 スペースキーでスタート 🐾</button>

      <!-- ホーム画面用写真（枠なし） -->
      <div class="cat-photo">
        <img id="title-cat-img" alt="ホーム画面の猫" />
      </div>
    </section>

    <!-- 2. ゲーム画面 -->
    <section id="game-screen" class="screen">
      <header class="game-header">
        <div>レベル <strong id="disp-level">1</strong></div>
        <div>つぎのレベルまで <strong id="disp-next">3</strong></div>
        <div>スコア <strong id="disp-score">0</strong></div>
        <div>残り時間 <strong id="disp-time">60</strong>秒</div>
      </header>

      <!-- コマ歩きエリア -->
      <div class="cat-track-area">
        <div class="track-line-bg"></div>
        <div id="walking-cat" class="cat-avatar">
          <img id="walking-cat-img" alt="コマ送りで動く猫" />
        </div>
      </div>

      <div class="word-card">
        <p class="instruction">表示されている文字を、そのまま入力してね</p>
        <div id="word-display" class="word-display"></div>
        <div id="romaji-display" class="romaji-display"></div>
        <div id="reading-display" class="reading-display"></div>
      </div>

      <footer class="game-footer">
        <div class="stats-group">
          <div>正確さ <strong id="disp-accuracy">100%</strong></div>
          <div>コンボ <strong id="disp-combo">0</strong></div>
          <div>ベスト <strong id="disp-best">0</strong></div>
        </div>

        <div class="cat-speech-wrapper">
          <div class="speech-bubble">
            <span id="message">キーボードで文字を打ってみよう！ 🐾</span>
          </div>
          <div class="cat-photo game-cat">
            <img id="game-cat-img" alt="ゲーム画面の猫" />
          </div>
        </div>
      </footer>
    </section>

    <!-- 3. リザルト画面 -->
    <section id="result-screen" class="screen">
      <p class="eyebrow">🐾 おつかれさま！ 🐾</p>
      <h2 id="result-title">TIME UP!</h2>

      <div class="result-score">
        <span>スコア</span>
        <strong id="result-score">0</strong>
      </div>

      <div class="result-stats">
        <div>正確さ<strong id="result-accuracy">0%</strong></div>
        <div>最大コンボ<strong id="result-combo">0</strong></div>
        <div>今回保護<strong id="result-rescued">0匹</strong></div>
        <div>累計保護<strong id="result-total-rescued">0匹</strong></div>
      </div>

      <p id="new-best" class="new-best"></p>

      <button id="restart-button" class="space-button" type="button" onclick="showTitle()">🐾 スペースキーでタイトルへ 🐾</button>

      <!-- リザルト画面用写真（枠なし） -->
      <div class="cat-photo" style="margin-top: 10px;">
        <img id="result-cat-img" alt="結果画面の猫" />
      </div>
    </section>

  </main>

    // 候補パス生成関数（cat_picture フォルダを最優先検索！）
    function getCandidatePaths(baseNames) {
      const paths = [];
      const names = Array.isArray(baseNames) ? baseNames : [baseNames];

      names.forEach(name => {
        // 0. 埋め込み画像（最優先）
        if (EMBEDDED_IMAGES[name]) paths.push(EMBEDDED_IMAGES[name]);

        // 1. cat_picture/ 直下
        paths.push(`cat_picture/${name}.jpg`);
        paths.push(`cat_picture/${name}.png`);
        
        // 2. assets/cats/cat_picture/
        paths.push(`assets/cats/cat_picture/${name}.jpg`);
        paths.push(`assets/cats/cat_picture/${name}.png`);
        
        // 3. assets/cats/
        paths.push(`assets/cats/${name}.jpg`);
        paths.push(`assets/cats/${name}.png`);
        
        // 4. カレントディレクトリ
        paths.push(`${name}.jpg`);
        paths.push(`${name}.png`);
      });

      return paths;
    }

    // エラー時に次の候補へ自動フォールバックして画像をセットする関数
    function setImageWithSmartFallback(imgElem, candidatePaths) {
      if (!imgElem || !candidatePaths || candidatePaths.length === 0) return;
      let idx = 0;

      imgElem.onerror = function() {
        idx++;
        if (idx < candidatePaths.length) {
          this.src = candidatePaths[idx];
        } else {
          this.onerror = null;
        }
      };

      imgElem.src = candidatePaths[0];
    }

    // 画像と同じように、複数の置き場所を順番に探す
    function getSoundPaths(name) {
      return [
        `sounds/${name}.mp3`,
        `assets/sounds/${name}.mp3`,
        `${name}.mp3`
      ];
    }

    // ■ 再生方法①（優先）: Web Audio
    //   埋め込んだ音声データをそのままデコードして再生する（音量・速度・エフェクトは一切かけない）。
    //   ファイルを読み込まないので、プレビューなど音声ファイルの読み込みが制限される環境でも動く。
    // ■ 再生方法②（予備）: audio要素
    //   Web Audioが使えないときだけ、sounds フォルダのmp3（なければ埋め込みデータ）を再生する。
    let audioCtx = null;
    const soundBuffers = {};
    const soundPools = {};
    let useFallbackAudio = false;

    function dataUriToArrayBuffer(uri) {
      const bin = atob(uri.slice(uri.indexOf(',') + 1));
      const bytes = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
      return bytes.buffer;
    }

    function decodeAudio(ctx, arrayBuffer) {
      return new Promise((resolve, reject) => {
        const p = ctx.decodeAudioData(arrayBuffer, resolve, reject);
        if (p && p.catch) p.catch(reject);
      });
    }

    function initFallbackSounds() {
      if (useFallbackAudio) return;
      useFallbackAudio = true;
      Object.keys(SOUND_NAMES).forEach(key => {
        const paths = [...getSoundPaths(SOUND_NAMES[key]), SOUND_DATA[key]];
        const pool = [];
        for (let n = 0; n < SOUND_POOL_SIZE[key]; n++) {
          const audio = new Audio();
          audio.preload = 'auto';
          let idx = 0;
          audio.addEventListener('error', () => {
            idx++;
            if (idx < paths.length) audio.src = paths[idx];
          });
          audio.src = paths[0];
          pool.push(audio);
        }
        soundPools[key] = { pool, next: 0 };
      });
    }

    function initSounds() {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { initFallbackSounds(); return; }
      try {
        audioCtx = new AC();
      } catch (e) {
        initFallbackSounds();
        return;
      }

      Object.keys(SOUND_NAMES).forEach(key => {
        decodeAudio(audioCtx, dataUriToArrayBuffer(SOUND_DATA[key]))
          .then(buf => { soundBuffers[key] = buf; })
          .catch(() => initFallbackSounds());
      });

      // ブラウザは最初のキー入力やクリックがあるまで音の再生を許可しないので、操作されたら再生を有効にする
      const unlock = () => {
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      };
      ['keydown', 'pointerdown', 'click'].forEach(ev =>
        window.addEventListener(ev, unlock, { passive: true })
      );
    }

    function playSound(key) {
      try {
        if (audioCtx && soundBuffers[key]) {
          if (audioCtx.state === 'suspended') audioCtx.resume();
          const src = audioCtx.createBufferSource();
          src.buffer = soundBuffers[key];
          src.connect(audioCtx.destination); // 途中に何も挟まない（無加工）
          src.start(0);
          return;
        }

        const entry = soundPools[key];
        if (!entry) return;
        const audio = entry.pool[entry.next];
        entry.next = (entry.next + 1) % entry.pool.length;
        audio.currentTime = 0; // 頭から再生するだけ
        const p = audio.play();
        if (p && p.catch) p.catch(() => {});
      } catch (e) {
        // 音が出せない環境でもゲームは続行
      }
    }

    function unitsOf(word) {
      const normalizedChars = [...word].map(plainChar);
      const originalChars = [...word];
      const units = [];

      let i = 0;
      while (i < normalizedChars.length) {
        const char = normalizedChars[i];
        const nextChar = normalizedChars[i + 1] || '';
        const pair = char + nextChar;

        if (pairMap[pair]) {
          const showDisp = originalChars[i] + (originalChars[i + 1] || '');
          units.push({ show: showDisp, options: pairMap[pair] });
          i += 2;
          continue;
        }

        if (char === 'っ') {
          const nextPair = nextChar + (normalizedChars[i + 2] || '');
          let nextOpts = [];
          if (pairMap[nextPair]) {
            nextOpts = pairMap[nextPair];
          } else if (romanMap[nextChar]) {
            nextOpts = romanMap[nextChar];
          }

          if (nextOpts.length > 0) {
            const initials = [...new Set(nextOpts.map(opt => opt[0]))];
            const opts = [...initials, 'xtu', 'ltu', 'ltsu'];
            units.push({ show: originalChars[i], options: opts });
          } else {
            units.push({ show: originalChars[i], options: ['xtu', 'ltu', 'ltsu'] });
          }
          i++;
          continue;
        }

        const showDisp = originalChars[i];
        const opts = romanMap[char] || [char];
        units.push({ show: showDisp, options: opts });
        i++;
      }
      return units;
    }

    function updateBestDisplay() {
      $('best-score-title').textContent = best.toLocaleString();
      $('total-rescued-title').textContent = `${totalRescued.toLocaleString()}匹`;
      $('disp-best').textContent = best.toLocaleString();
    }

    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      $(screenId).classList.add('active');
    }

    function showTitle() {
      clearInterval(clock);
      updateBestDisplay();
      
      // タイトル画像、リザルト画像の読み込み設定（cat_picture 優先）
      setImageWithSmartFallback($('title-cat-img'), getCandidatePaths(['home_cat', '6277']));
      setImageWithSmartFallback($('game-cat-img'), getCandidatePaths(['home_cat', '6277']));
      setImageWithSmartFallback($('result-cat-img'), getCandidatePaths(['result_cat', '350']));

      switchScreen('title-screen');
    }

    function startGame() {
      playSound('start');
      currentLevel = 0;
      wordIndexInLevel = 0;
      wordCountInLevel = 0;
      unitIndex = 0;
      typedPart = '';
      score = 0;
      combo = 0;
      maxCombo = 0;
      correct = 0;
      attempts = 0;
      timeLeft = 60;
      rescuedCount = 0;

      switchScreen('game-screen');
      resetCatPosition();
      loadNextWord();

      if (clock)clearInterval(clock);
      clock = setInterval(() => {
        timeLeft--;
        $('disp-time').textContent = timeLeft;
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function loadNextWord() {
      const wordList = levels[currentLevel].words;
      const targetWord = wordList[wordIndexInLevel % wordList.length];
      currentUnits = unitsOf(targetWord);
      unitIndex = 0;
      typedPart = '';
      updateUI();
    }

    function updateUI() {
      $('disp-level').textContent = currentLevel + 1;
      $('disp-next').textContent = 3 - wordCountInLevel;
      $('disp-score').textContent = score.toLocaleString();
      $('disp-combo').textContent = combo;
      $('disp-time').textContent = timeLeft;

      const accuracy = attempts > 0 ? Math.round((correct / attempts) * 100) : 100;
      $('disp-accuracy').textContent = accuracy + '%';

      $('word-display').innerHTML = currentUnits.map((u, i) => {
        let cls = 'pending';
        if (i < unitIndex) cls = 'done';
        else if (i === unitIndex) cls = 'current';
        return `<span class="${cls}">${u.show}</span>`;
      }).join('');

      let romajiHtml = '';
      currentUnits.forEach((u, i) => {
        let targetRoman = u.options[0];
        if (i === unitIndex && typedPart.length > 0) {
          const matchOpt = u.options.find(opt => opt.startsWith(typedPart));
          if (matchOpt) targetRoman = matchOpt;
        }

        if (i < unitIndex) {
          romajiHtml += `<span class="unit-group">${[...targetRoman].map(c => `<span class="done">${c}</span>`).join('')}</span> `;
        } else if (i > unitIndex) {
          romajiHtml += `<span class="unit-group">${[...targetRoman].map(c => `<span class="pending">${c}</span>`).join('')}</span> `;
        } else {
          let unitHtml = '<span class="unit-group">';
          const typedLen = typedPart.length;
          for (let cIdx = 0; cIdx < targetRoman.length; cIdx++) {
            const char = targetRoman[cIdx];
            if (cIdx < typedLen) {
              unitHtml += `<span class="done">${char}</span>`;
            } else if (cIdx === typedLen) {
              unitHtml += `<span class="current">${char}</span>`;
            } else {
              unitHtml += `<span class="pending">${char}</span>`;
            }
          }
          unitHtml += '</span> ';
          romajiHtml += unitHtml;
        }
      });
      $('romaji-display').innerHTML = romajiHtml;

      $('reading-display').textContent = '「ー」はハイフン (-) キー';
    }

    function resetCatPosition() {
      const catElem = $('walking-cat');
      catElem.style.transition = 'none';
      catElem.style.right = '30px';
      catElem.className = 'cat-avatar';
      
      // 最初は cat1（または 6715）の候補パスからセット
      setImageWithSmartFallback($('walking-cat-img'), getCandidatePaths(['cat1', '6715']));
    }

    function playKomaCatCrossAnimation() {
      const catElem = $('walking-cat');
      const catImg = $('walking-cat-img');
      rescuedCount++;

      // 解放済み猫の中からランダム選出してセット
      const randomCatPaths = getRandomUnlockedCatPaths();
      setImageWithSmartFallback(catImg, randomCatPaths);

      catElem.style.transition = 'none';
      catElem.style.right = '30px';
      catElem.className = 'cat-avatar';

      const totalSteps = 5;
      const duration = 1200;
      const stepTime = duration / totalSteps;
      let currentStep = 0;

      const timer = setInterval(() => {
        currentStep++;
        const rightPercent = 3 + (currentStep / totalSteps) * 82;
        catElem.style.right = rightPercent + '%';

        if (currentStep % 2 === 1) {
          catElem.classList.add('koma-step-1');
          catElem.classList.remove('koma-step-2');
        } else {
          catElem.classList.add('koma-step-2');
          catElem.classList.remove('koma-step-1');
        }

        if (currentStep >= totalSteps) {
          clearInterval(timer);
          setTimeout(() => {
            resetCatPosition();
          }, 250);
        }
      }, stepTime);
    }

    window.addEventListener('keydown', e => {
      // ゲーム中に Esc でホーム（タイトル）画面へ戻る
      if (e.key === 'Escape') {
        if ($('game-screen').classList.contains('active')) {
          e.preventDefault();
          showTitle();
        }
        return;
      }

      if (e.code === 'Space') {
        if ($('title-screen').classList.contains('active')) {
          e.preventDefault();
          startGame();
          return;
        } else if ($('result-screen').classList.contains('active')) {
          e.preventDefault();
          showTitle();
          return;
        }
      }

      if (!($('game-screen').classList.contains('active'))) return;
      if (e.key.length !== 1 || e.altKey || e.ctrlKey || e.metaKey) return;

      const key = e.key.toLowerCase();
      attempts++;
      const currentUnit = currentUnits[unitIndex];
      if (!currentUnit) return;

      const nextTyped = typedPart + key;
      const matchedOptions = currentUnit.options.filter(opt => opt.startsWith(nextTyped));

      if (matchedOptions.length > 0) {
        playSound('key');
        typedPart = nextTyped;
        correct++;
        score += 10 + combo * 2;
        combo++;
        if (combo > maxCombo) maxCombo = combo;
        $('message').textContent = 'いいね！その調子 🐾';

        const isComplete = matchedOptions.some(opt => opt === typedPart);
        if (isComplete) {
          unitIndex++;
          typedPart = '';

          if (unitIndex >= currentUnits.length) {
            wordIndexInLevel++;
            wordCountInLevel++;

            playKomaCatCrossAnimation();

            if (wordCountInLevel >= 3) {
              wordCountInLevel = 0;
              if (currentLevel < levels.length - 1) {
                currentLevel++;
                $('message').textContent = '🎉 レベルアップ！文章が長くなるよ！';
              }
            }

            setTimeout(loadNextWord, 250);
            return;
          }
        }
      } else {
        playSound('miss');
        combo = 0;
        $('message').textContent = 'おしい！その文字からもう一度！ 🐾';
      }

      updateUI();
    });

    function endGame() {
      clearInterval(clock);
      const accuracy = attempts > 0 ? Math.round((correct / attempts) * 100) : 0;
      const isNewBest = score > best;

      if (isNewBest) {
        best = score;
        localStorage.setItem('catTypingBest', best);
      }

      const prevTotalRescued = totalRescued;
      totalRescued += rescuedCount;
      localStorage.setItem('catTypingTotalRescued', totalRescued);
      const newCatUnlocked = catUnlockRules.some(rule => prevTotalRescued < rule.min && totalRescued >= rule.min);

      $('result-title').textContent = currentLevel === 4 ? 'すごーい！達成！' : 'TIME UP!';
      $('result-score').textContent = score.toLocaleString();
      $('result-accuracy').textContent = accuracy + '%';
      $('result-combo').textContent = maxCombo;
      $('result-rescued').textContent = `${rescuedCount}匹`;
      $('result-total-rescued').textContent = `${totalRescued}匹`;
      $('new-best').textContent = isNewBest ? '🎉 ハイスコア更新！' : '';

      switchScreen('result-screen');
      if (newCatUnlocked) playSound('unlock');
    }

    // 初期化実行
    initSounds();
    showTitle();
  </script>
</body>
</html>
